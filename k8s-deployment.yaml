apiVersion: apps/v1
kind: Deployment
metadata:
  name: treetracker-capture-service
  namespace: treetracker-webapp-mvp
  labels:
    app: treetracker-capture-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treetracker-capture-service
  template:
    metadata:
      labels:
        app: treetracker-capture-service
    spec:
      containers:
      - name: treetracker-capture-service
        image: registry.digitalocean.com/treetracker-registry/treetracker-web:capture-service
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        - name: DATABASE_URL
          value: "postgresql://postgres:password@postgres:5432/treetracker"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: IPFS_API_URL
          value: "http://ipfs:5001"
        - name: BLOCKCHAIN_API_URL
          value: "http://blockchain-auth:3000"
        - name: AUTH_SERVICE_URL
          value: "http://treetracker-auth-service:3001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: treetracker-capture-service
  namespace: treetracker-webapp-mvp
  labels:
    app: treetracker-capture-service
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
  selector:
    app: treetracker-capture-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: treetracker-capture-service
  namespace: treetracker-webapp-mvp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - capture-api.treetracker.org
    secretName: treetracker-capture-tls
  rules:
  - host: capture-api.treetracker.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: treetracker-capture-service
            port:
              number: 3002